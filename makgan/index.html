<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>막간 — 웨이팅을 웨이팅하지 마세요</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0c0c0d;
      --surface: #161618;
      --surface2: #1e1e21;
      --surface3: #262629;
      --border: rgba(255,255,255,0.08);
      --border2: rgba(255,255,255,0.12);
      --accent: #8b7ff5;
      --accent-dim: rgba(139,127,245,0.12);
      --accent-dim2: rgba(139,127,245,0.2);
      --text: #f0ede8;
      --text-sub: #8a877f;
      --text-dim: #3a3935;
      --green: #4ade80;
      --green-dim: rgba(74,222,128,0.1);
      --r: 14px;
      --r-lg: 20px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; background: var(--bg); }
    body { font-family: 'Noto Sans KR', sans-serif; color: var(--text); display: flex; justify-content: center; }
    .phone { width: 100%; max-width: 390px; min-height: 100vh; display: flex; flex-direction: column; position: relative; }
    .screen { display: none; flex-direction: column; flex: 1; padding: 20px 20px 36px; animation: fadeIn 0.25s ease; }
    .screen.active { display: flex; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    .app-logo { font-size: 20px; font-weight: 900; letter-spacing: -0.5px; margin-bottom: 2px; }
    .app-logo span { color: var(--accent); }
    .app-tagline { font-size: 11px; color: var(--text-sub); font-family: 'DM Mono', monospace; }
    .screen-title { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; line-height: 1.3; margin-bottom: 6px; }
    .screen-sub { font-size: 13px; color: var(--text-sub); line-height: 1.6; }
    .section { margin-bottom: 20px; }
    .section-label { font-size: 11px; font-weight: 500; color: var(--text-sub); letter-spacing: 1.2px; text-transform: uppercase; font-family: 'DM Mono', monospace; margin-bottom: 10px; }
    .input-field { width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 14px 16px; color: var(--text); font-size: 15px; font-family: 'Noto Sans KR', sans-serif; outline: none; transition: border-color 0.15s; }
    .input-field:focus { border-color: var(--accent); }
    .input-field::placeholder { color: var(--text-dim); }
    .onboard-q { margin-bottom: 20px; }
    .onboard-q-text { font-size: 14px; font-weight: 500; margin-bottom: 10px; line-height: 1.5; }
    .onboard-opts { display: flex; flex-direction: column; gap: 8px; }
    .onboard-opt { padding: 12px 16px; border: 1px solid var(--border); border-radius: var(--r); background: var(--surface); color: var(--text-sub); font-size: 13px; cursor: pointer; transition: all 0.15s; font-family: 'Noto Sans KR', sans-serif; text-align: left; }
    .onboard-opt.selected { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
    .onboard-progress { display: flex; gap: 6px; margin-bottom: 28px; }
    .progress-dot { height: 3px; flex: 1; border-radius: 2px; background: var(--surface3); transition: background 0.3s; }
    .progress-dot.active { background: var(--accent); }
    .time-display { font-size: 42px; font-weight: 900; color: var(--accent); letter-spacing: -2px; font-family: 'DM Mono', monospace; margin-bottom: 4px; line-height: 1; }
    .time-label { font-size: 13px; color: var(--text-sub); margin-bottom: 16px; }
    input[type=range] { width: 100%; -webkit-appearance: none; height: 4px; border-radius: 2px; background: var(--surface3); outline: none; margin-bottom: 8px; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: var(--accent); cursor: pointer; box-shadow: 0 0 0 4px var(--accent-dim2); }
    .slider-labels { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-dim); font-family: 'DM Mono', monospace; }
    .btn-primary { width: 100%; padding: 16px; background: var(--accent); border: none; border-radius: var(--r); color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; font-family: 'Noto Sans KR', sans-serif; transition: all 0.18s; }
    .btn-primary:hover { opacity: 0.9; }
    .btn-primary:disabled { background: var(--surface3); color: var(--text-dim); cursor: not-allowed; }
    .btn-secondary { width: 100%; padding: 14px; background: transparent; border: 1px solid var(--border); border-radius: var(--r); color: var(--text-sub); font-size: 14px; cursor: pointer; font-family: 'Noto Sans KR', sans-serif; transition: all 0.15s; margin-top: 10px; }
    .btn-secondary:hover { border-color: var(--border2); color: var(--text); }
    .btn-skip { background: none; border: none; color: var(--text-dim); font-size: 13px; cursor: pointer; font-family: 'Noto Sans KR', sans-serif; text-align: center; padding: 10px; width: 100%; }
    .place-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 20px; margin-bottom: 12px; animation: cardIn 0.4s ease forwards; opacity: 0; }
    @keyframes cardIn { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
    .place-card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
    .place-name { font-size: 17px; font-weight: 700; margin-bottom: 3px; }
    .place-cat { font-size: 12px; color: var(--text-sub); }
    .place-rating { font-size: 13px; font-weight: 600; color: #f59e0b; font-family: 'DM Mono', monospace; }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
    .chip { font-size: 11px; padding: 4px 10px; border-radius: 100px; border: 1px solid var(--border); color: var(--text-sub); }
    .chip.ok { color: var(--green); background: var(--green-dim); border-color: rgba(74,222,128,0.2); }
    .ai-reason { font-size: 13px; color: var(--text-sub); line-height: 1.6; padding-top: 12px; border-top: 1px solid var(--border); }
    .ai-tag { display: inline-flex; align-items: center; gap: 3px; font-size: 10px; font-weight: 600; color: var(--accent); background: var(--accent-dim); border: 1px solid rgba(139,127,245,0.2); padding: 2px 8px; border-radius: 100px; margin-right: 6px; font-family: 'DM Mono', monospace; }
    .action-row { display: flex; gap: 8px; margin-top: 4px; }
    .action-btn { flex: 1; padding: 12px 6px; border: 1px solid var(--border); border-radius: var(--r); font-size: 12px; color: var(--text-sub); cursor: pointer; background: transparent; font-family: 'Noto Sans KR', sans-serif; transition: all 0.15s; text-align: center; }
    .action-btn.yes { background: var(--accent); border-color: var(--accent); color: white; font-weight: 600; }
    .timer-wrap { display: flex; flex-direction: column; align-items: center; padding: 16px 0; }
    .timer-ring { position: relative; width: 160px; height: 160px; margin-bottom: 16px; }
    .timer-ring svg { transform: rotate(-90deg); }
    .timer-ring circle { fill: none; stroke-width: 6; }
    .timer-ring .track { stroke: var(--surface3); }
    .timer-ring .fill { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
    .timer-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .timer-val { font-size: 36px; font-weight: 900; font-family: 'DM Mono', monospace; color: var(--text); letter-spacing: -1px; }
    .timer-unit { font-size: 12px; color: var(--text-sub); margin-top: 2px; }
    .timer-status { font-size: 13px; color: var(--text-sub); text-align: center; }
    .dest-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 14px 16px; display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .dest-icon { width: 36px; height: 36px; background: var(--accent-dim); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
    .dest-name { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
    .dest-sub { font-size: 12px; color: var(--text-sub); }
    .loading-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; }
    .loading-dots { display: flex; gap: 8px; }
    .loading-dots span { width: 8px; height: 8px; background: var(--accent); border-radius: 50%; animation: pulse 1.4s infinite; }
    .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
    .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse { 0%,80%,100%{transform:scale(0.6);opacity:0.3} 40%{transform:scale(1);opacity:1} }
    .loading-text { font-size: 14px; color: var(--text-sub); text-align: center; }
    .loading-step { font-size: 12px; color: var(--text-dim); font-family: 'DM Mono', monospace; margin-top: 4px; text-align: center; }
    .config-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 20px; margin-bottom: 16px; }
    .config-label { font-size: 11px; font-weight: 500; color: var(--text-sub); letter-spacing: 1px; text-transform: uppercase; font-family: 'DM Mono', monospace; margin-bottom: 8px; }
    .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-80px); background: var(--green); color: #0c0c0d; padding: 12px 24px; border-radius: 100px; font-size: 14px; font-weight: 700; transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1); z-index: 999; white-space: nowrap; max-width: 90vw; }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .spacer { flex: 1; }
    .list-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 14px 16px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: border-color 0.15s; }
    .list-card:hover { border-color: var(--accent); }
    .list-name { font-size: 14px; font-weight: 600; margin-bottom: 3px; }
    .list-sub { font-size: 12px; color: var(--text-sub); }
    .list-walk { font-size: 13px; font-weight: 600; color: var(--accent); font-family: 'DM Mono', monospace; }
    .list-time { font-size: 11px; color: var(--text-dim); margin-top: 2px; text-align: right; }
    .store-item { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 12px 16px; margin-bottom: 8px; cursor: pointer; transition: border-color 0.15s; }
    .store-item:hover { border-color: var(--accent); }
    .store-item-name { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
    .store-item-addr { font-size: 12px; color: var(--text-sub); }
    .loc-btn { width: 100%; padding: 14px; background: var(--accent-dim); border: 1px solid rgba(139,127,245,0.3); border-radius: var(--r); color: var(--accent); font-size: 14px; font-weight: 600; cursor: pointer; font-family: 'Noto Sans KR', sans-serif; margin-bottom: 12px; }
  </style>
</head>
<body>
<div class="phone">

  <!-- Config -->
  <div class="screen active" id="screen-config" style="justify-content:center;">
    <div style="margin-bottom:32px;">
      <div class="app-logo">막<span>간</span></div>
      <div class="app-tagline">MAKGAN · 웨이팅을 웨이팅하지 마세요</div>
    </div>
    <div class="config-card">
      <div class="config-label">Claude API Key</div>
      <input class="input-field" type="password" id="claudeKey" placeholder="sk-ant-..." />
    </div>
    <button class="btn-primary" onclick="saveConfig()">시작하기</button>
    <p style="font-size:11px;color:var(--text-dim);text-align:center;margin-top:16px;line-height:1.6;">API 키는 이 기기에만 저장되며<br>외부로 전송되지 않습니다</p>
  </div>

  <!-- Onboarding -->
  <div class="screen" id="screen-onboard">
    <div class="app-logo" style="margin-bottom:24px;">막<span>간</span></div>
    <div class="onboard-progress">
      <div class="progress-dot active" id="dot0"></div>
      <div class="progress-dot" id="dot1"></div>
      <div class="progress-dot" id="dot2"></div>
    </div>
    <div id="onboard-container"></div>
    <div class="spacer"></div>
    <button class="btn-primary" id="onboardNext" onclick="nextOnboard()" disabled>다음</button>
    <button class="btn-skip" onclick="skipOnboard()">건너뛰기</button>
  </div>

  <!-- Home -->
  <div class="screen" id="screen-home">
    <div style="margin-bottom:24px;">
      <div class="app-logo">막<span>간</span></div>
      <div class="app-tagline">MAKGAN · 웨이팅을 웨이팅하지 마세요</div>
    </div>
    <div class="section">
      <div class="section-label">웨이팅 중인 가게</div>
      <button class="loc-btn" id="locBtn" onclick="getLocation()">📍 현재 위치로 주변 가게 찾기</button>
      <input class="input-field" type="text" id="storeName" placeholder="또는 가게 이름 직접 입력" oninput="onStoreInput()" style="margin-bottom:8px;" />
      <div id="storeResults"></div>
      <div id="selectedStore" style="display:none; background:var(--accent-dim); border:1px solid rgba(139,127,245,0.3); border-radius:var(--r); padding:12px 16px; margin-top:8px;">
        <div style="font-size:12px;color:var(--accent);margin-bottom:2px;">선택된 가게</div>
        <div id="selectedStoreName" style="font-size:14px;font-weight:600;"></div>
        <div id="selectedStoreAddr" style="font-size:12px;color:var(--text-sub);"></div>
      </div>
    </div>
    <div class="section">
      <div class="section-label">남은 대기시간</div>
      <div class="time-display" id="timeDisplay">40분</div>
      <div class="time-label">슬라이더로 조절하세요</div>
      <input type="range" id="timeSlider" min="10" max="90" value="40" step="5" oninput="updateTime(this.value)" />
      <div class="slider-labels"><span>10분</span><span>30분</span><span>60분</span><span>90분</span></div>
    </div>
    <div class="spacer"></div>
    <button class="btn-primary" id="homeBtn" onclick="startSearch()" disabled>AI 추천 받기</button>
  </div>

  <!-- Loading -->
  <div class="screen" id="screen-loading" style="justify-content:center;">
    <div class="loading-wrap">
      <div class="loading-dots"><span></span><span></span><span></span></div>
      <div>
        <div class="loading-text">주변 장소를 분석하고 있어요</div>
        <div class="loading-step" id="loadingStep">가게 분위기 파악 중...</div>
      </div>
    </div>
  </div>

  <!-- AI Recommend -->
  <div class="screen" id="screen-recommend">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;">
      <div>
        <div class="app-logo">막<span>간</span></div>
        <div class="app-tagline">AI 추천</div>
      </div>
      <div style="font-size:11px;color:var(--text-sub);font-family:'DM Mono',monospace;" id="recTimeLeft"></div>
    </div>
    <div id="recCard"></div>
    <div class="action-row" id="recActions">
      <button class="action-btn yes" onclick="goPlace()">좋아, 여기 갈게</button>
      <button class="action-btn" onclick="nextRec()">다른 거</button>
      <button class="action-btn" onclick="showList()">내가 고를게</button>
    </div>
  </div>

  <!-- Full List -->
  <div class="screen" id="screen-list">
    <div style="margin-bottom:20px;">
      <button onclick="goScreen('screen-recommend')" style="background:none;border:none;color:var(--text-sub);font-size:13px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;padding:0;margin-bottom:12px;">← 돌아가기</button>
      <div class="app-logo" style="font-size:17px;">막<span>간</span> — 전체 목록</div>
      <div style="font-size:13px;color:var(--text-sub);margin-top:4px;" id="listSub"></div>
    </div>
    <div id="listContainer" style="overflow-y:auto;flex:1;"></div>
  </div>

  <!-- Timer -->
  <div class="screen" id="screen-timer">
    <div style="margin-bottom:16px;">
      <div class="app-logo">막<span>간</span></div>
      <div class="app-tagline">즐기고 계세요!</div>
    </div>
    <div class="timer-wrap">
      <div class="timer-ring">
        <svg width="160" height="160" viewBox="0 0 160 160">
          <circle class="track" cx="80" cy="80" r="70" />
          <circle class="fill" id="timerArc" cx="80" cy="80" r="70" stroke-dasharray="439.82" stroke-dashoffset="0" />
        </svg>
        <div class="timer-center">
          <div class="timer-val" id="timerVal">--:--</div>
          <div class="timer-unit">남은 시간</div>
        </div>
      </div>
      <div class="timer-status" id="timerStatus"></div>
    </div>
    <div class="dest-card" id="destCard"></div>
    <div class="spacer"></div>
    <button class="btn-secondary" onclick="resetAll()">다시 검색하기</button>
  </div>

</div>
<div class="toast" id="toast">⏰ 지금 출발하세요!</div>

<script>
  let claudeKey = '';
  let selectedTime = 40;
  let storeNameText = '';
  let storeX = null, storeY = null;
  let userX = null, userY = null;
  let allPlaces = [];
  let currentRecIdx = 0;
  let timerInterval = null;
  let timerSecs = 0;
  let totalSecs = 0;
  let currentPlace = null;
  let onboardStep = 0;
  let onboardAnswers = {};
  let storeSearchTimeout = null;

  const onboardQuestions = [
    { q: '새로운 곳이 좋아요, 익숙한 곳이 편해요?', opts: ['새로운 곳 탐험하기', '검증된 곳이 편해요'] },
    { q: '주로 어떻게 시간 보내는 걸 좋아해요?', opts: ['둘러보기 (편집샵, 서점)', '잠깐 쉬기 (공원, 벤치)', '걷기 (골목, 산책)'] },
    { q: '실내가 편해요, 실외가 좋아요?', opts: ['실내가 편해요', '날씨 좋으면 실외도 좋아요'] }
  ];

  function goScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  function saveConfig() {
    claudeKey = document.getElementById('claudeKey').value.trim();
    if (!claudeKey) { alert('Claude API 키를 입력해주세요.'); return; }
    onboardStep = 0;
    renderOnboard();
    goScreen('screen-onboard');
  }

  function renderOnboard() {
    const q = onboardQuestions[onboardStep];
    document.getElementById('onboard-container').innerHTML = `
      <div style="margin-bottom:28px;">
        <div class="screen-title">${q.q}</div>
      </div>
      <div class="onboard-opts">
        ${q.opts.map((o, i) => `<button class="onboard-opt" onclick="selectOnboardOpt(${i}, this)">${o}</button>`).join('')}
      </div>`;
    document.getElementById('onboardNext').disabled = true;
    document.querySelectorAll('.progress-dot').forEach((d, i) => d.classList.toggle('active', i <= onboardStep));
  }

  function selectOnboardOpt(idx, el) {
    document.querySelectorAll('.onboard-opt').forEach(o => o.classList.remove('selected'));
    el.classList.add('selected');
    onboardAnswers[onboardStep] = onboardQuestions[onboardStep].opts[idx];
    document.getElementById('onboardNext').disabled = false;
  }

  function nextOnboard() {
    if (onboardStep < onboardQuestions.length - 1) { onboardStep++; renderOnboard(); }
    else goScreen('screen-home');
  }

  function skipOnboard() { goScreen('screen-home'); }

  // 위치 기반 가게 찾기
  async function getLocation() {
    const btn = document.getElementById('locBtn');
    btn.textContent = '📍 위치 확인 중...';
    btn.disabled = true;
    navigator.geolocation.getCurrentPosition(async (pos) => {
      userX = pos.coords.longitude;
      userY = pos.coords.latitude;
      btn.textContent = '✓ 위치 확인됨 — 가게 이름을 검색하세요';
      btn.disabled = false;
    }, () => {
      btn.textContent = '📍 위치 접근 거부됨 — 직접 입력해주세요';
      btn.disabled = false;
    });
  }

  // 가게 검색
  function onStoreInput() {
    const val = document.getElementById('storeName').value.trim();
    document.getElementById('selectedStore').style.display = 'none';
    storeNameText = val;
    storeX = null; storeY = null;
    checkHome();
    if (storeSearchTimeout) clearTimeout(storeSearchTimeout);
    if (val.length < 2) { document.getElementById('storeResults').innerHTML = ''; return; }
    storeSearchTimeout = setTimeout(() => searchStore(val), 400);
  }

  async function searchStore(query) {
    try {
      const x = userX || 126.9780;
      const y = userY || 37.5665;
      const res = await fetch(`/.netlify/functions/kakao?type=search_keyword&query=${encodeURIComponent(query)}&x=${x}&y=${y}`);
      const data = await res.json();
      const places = data.documents || [];
      const container = document.getElementById('storeResults');
      if (!places.length) { container.innerHTML = ''; return; }
      container.innerHTML = places.slice(0, 5).map((p, i) => `
        <div class="store-item" onclick="selectStore('${p.place_name.replace(/'/g,"\\'")}', '${p.road_address_name || p.address_name}', ${p.x}, ${p.y})">
          <div class="store-item-name">${p.place_name}</div>
          <div class="store-item-addr">${p.road_address_name || p.address_name}</div>
        </div>`).join('');
    } catch(e) {
      // 카카오 API 없으면 그냥 텍스트 입력 모드
      document.getElementById('storeResults').innerHTML = '';
    }
  }

  function selectStore(name, addr, x, y) {
    storeNameText = name;
    storeX = parseFloat(x);
    storeY = parseFloat(y);
    document.getElementById('storeName').value = name;
    document.getElementById('storeResults').innerHTML = '';
    document.getElementById('selectedStoreName').textContent = name;
    document.getElementById('selectedStoreAddr').textContent = addr;
    document.getElementById('selectedStore').style.display = 'block';
    checkHome();
  }

  function checkHome() {
    const hasStore = storeNameText.length > 0;
    document.getElementById('homeBtn').disabled = !hasStore;
  }

  function updateTime(val) {
    selectedTime = parseInt(val);
    document.getElementById('timeDisplay').textContent = selectedTime + '분';
  }

  const loadingSteps = ['가게 분위기 파악 중...', '주변 장소 검색 중...', 'AI가 취향 분석 중...', '최적 장소 선별 중...'];

  async function startSearch() {
    goScreen('screen-loading');
    let stepIdx = 0;
    const stepInterval = setInterval(() => {
      document.getElementById('loadingStep').textContent = loadingSteps[stepIdx % loadingSteps.length];
      stepIdx++;
    }, 1200);

    try {
      // 실제 주변 장소 가져오기 (카카오 API)
      let nearbyPlaces = [];
      const x = storeX || userX || 126.9780;
      const y = storeY || userY || 37.5665;
      const radius = Math.min(selectedTime * 70, 800);

      try {
        const keywords = ['편집샵', '소품샵', '서점', '공원', '산책로', '올리브영', '다이소'];
        const results = await Promise.all(keywords.slice(0, 3).map(kw =>
          fetch(`/.netlify/functions/kakao?type=search_category&query=${encodeURIComponent(kw)}&x=${x}&y=${y}&radius=${radius}`)
            .then(r => r.json()).then(d => d.documents || []).catch(() => [])
        ));
        nearbyPlaces = results.flat().filter((p, i, arr) =>
          arr.findIndex(q => q.id === p.id) === i
        ).slice(0, 15);
      } catch(e) {}

      allPlaces = await getAIRecommendations(nearbyPlaces, x, y);
      currentRecIdx = 0;
      clearInterval(stepInterval);
      showRecommend();
    } catch(e) {
      clearInterval(stepInterval);
      allPlaces = getMockPlaces();
      currentRecIdx = 0;
      showRecommend();
    }
  }

  async function getAIRecommendations(nearbyPlaces, x, y) {
    const pref = Object.values(onboardAnswers).join(', ') || '특별한 선호 없음';
    const placesInfo = nearbyPlaces.length > 0
      ? nearbyPlaces.map(p => {
          const dist = Math.round(Math.sqrt(Math.pow((p.x - x) * 88000, 2) + Math.pow((p.y - y) * 111000, 2)));
          const walkMin = Math.max(1, Math.round(dist / 70));
          return `${p.place_name} (${p.category_name}, 도보 ${walkMin}분, ${p.road_address_name || p.address_name})`;
        }).join('\n')
      : '실제 주변 장소 데이터 없음 (한국 도심 기준으로 추천해주세요)';

    const prompt = `웨이팅 중 틈새시간 추천 AI입니다.

웨이팅 중인 가게: ${storeNameText}
남은 대기시간: ${selectedTime}분
사용자 취향: ${pref}

주변 장소 목록:
${placesInfo}

위 가게의 분위기를 리뷰 키워드로 추론하고, ${selectedTime}분 안에 다녀올 수 있는 장소 4곳을 추천해주세요.
- 왕복 도보 이동시간 + 체류시간 + 여유 5분 ≤ ${selectedTime}분
- 웨이팅 중인 가게와 같은 카테고리(식사, 카페, 음료) 제외
- 주변 장소 목록에서 선택하되, 없으면 실제 있을 법한 장소로 추천

JSON만 응답:
[{"name":"장소명","category":"카테고리","rating":"4.5","walkMin":5,"stayMin":20,"reason":"20자 이내 추천 이유"}]`;

    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-api-key': claudeKey, 'anthropic-version': '2023-06-01' },
      body: JSON.stringify({ model: 'claude-sonnet-4-20250514', max_tokens: 1000, messages: [{ role: 'user', content: prompt }] })
    });
    const data = await res.json();
    const text = data.content?.[0]?.text || '[]';
    return JSON.parse(text.replace(/```json|```/g, '').trim());
  }

  function getMockPlaces() {
    return [
      { name: '모노하 편집샵', category: '편집샵', rating: '4.6', walkMin: 5, stayMin: 20, reason: '감성적인 소품 구경하기 좋아요' },
      { name: '올리브영', category: '드럭스토어', rating: '4.2', walkMin: 3, stayMin: 22, reason: '가볍게 둘러보기 좋아요' },
      { name: '근처 포토스팟 골목', category: '산책', rating: '4.5', walkMin: 4, stayMin: 21, reason: '예쁜 골목 사진 찍기 좋아요' },
    ].filter(p => (p.walkMin * 2 + p.stayMin + 5) <= selectedTime);
  }

  function showRecommend() {
    goScreen('screen-recommend');
    document.getElementById('recTimeLeft').textContent = selectedTime + '분 남음';
    renderRecCard();
  }

  function renderRecCard() {
    const container = document.getElementById('recCard');
    if (!allPlaces.length) {
      container.innerHTML = `<div style="text-align:center;padding:40px 0;color:var(--text-sub);font-size:14px;line-height:1.8;">조건에 맞는 장소를 찾지 못했어요.<br>시간을 늘리거나 다시 검색해보세요.</div>`;
      document.getElementById('recActions').style.display = 'none';
      return;
    }
    const p = allPlaces[currentRecIdx % allPlaces.length];
    container.innerHTML = `
      <div class="place-card">
        <div class="place-card-top">
          <div><div class="place-name">${p.name}</div><div class="place-cat">${p.category}</div></div>
          <div class="place-rating">★ ${p.rating}</div>
        </div>
        <div class="chips">
          <div class="chip">도보 ${p.walkMin}분</div>
          <div class="chip">체류 약 ${p.stayMin}분</div>
          <div class="chip ok">✓ 시간 내 가능</div>
        </div>
        <div class="ai-reason"><span class="ai-tag">AI</span>${p.reason}</div>
      </div>`;
    currentPlace = p;
  }

  function nextRec() { currentRecIdx = (currentRecIdx + 1) % allPlaces.length; renderRecCard(); }

  function showList() {
    goScreen('screen-list');
    document.getElementById('listSub').textContent = `${selectedTime}분 안에 갈 수 있는 곳 ${allPlaces.length}개`;
    document.getElementById('listContainer').innerHTML = allPlaces.map((p, i) => `
      <div class="list-card" onclick="selectFromList(${i})">
        <div><div class="list-name">${p.name}</div><div class="list-sub">${p.category} · ★ ${p.rating}</div></div>
        <div><div class="list-walk">${p.walkMin}분</div><div class="list-time">체류 ${p.stayMin}분</div></div>
      </div>`).join('');
  }

  function selectFromList(idx) { currentPlace = allPlaces[idx]; goPlace(); }

  function goPlace() {
    goScreen('screen-timer');
    const p = currentPlace;
    document.getElementById('destCard').innerHTML = `
      <div class="dest-icon">📍</div>
      <div><div class="dest-name">${p.name}</div><div class="dest-sub">도보 ${p.walkMin}분 · ${p.category}</div></div>`;
    startTimer(selectedTime);
  }

  function startTimer(mins) {
    timerSecs = mins * 60;
    totalSecs = timerSecs;
    if (timerInterval) clearInterval(timerInterval);
    updateTimerDisplay();
    const alertAt = Math.max(0, timerSecs - Math.min(10 * 60, Math.floor(totalSecs * 0.25)));
    timerInterval = setInterval(() => {
      timerSecs--;
      updateTimerDisplay();
      if (timerSecs === alertAt || timerSecs <= 0) showToast();
      if (timerSecs <= 0) clearInterval(timerInterval);
    }, 1000);
  }

  function updateTimerDisplay() {
    const m = Math.floor(timerSecs / 60);
    const s = timerSecs % 60;
    document.getElementById('timerVal').textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    const pct = timerSecs / totalSecs;
    document.getElementById('timerArc').style.strokeDashoffset = 439.82 * (1 - pct);
    const alertMin = Math.round(Math.min(10, selectedTime * 0.25));
    document.getElementById('timerStatus').textContent = `${alertMin}분 전에 복귀 알림을 보내드릴게요`;
    if (timerSecs <= 300) {
      document.getElementById('timerArc').style.stroke = '#ef4444';
      document.getElementById('timerVal').style.color = '#ef4444';
    }
  }

  function showToast() {
    const t = document.getElementById('toast');
    t.classList.add('show');
    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
    setTimeout(() => t.classList.remove('show'), 4000);
  }

  function resetAll() {
    if (timerInterval) clearInterval(timerInterval);
    storeNameText = ''; storeX = null; storeY = null;
    document.getElementById('storeName').value = '';
    document.getElementById('storeResults').innerHTML = '';
    document.getElementById('selectedStore').style.display = 'none';
    document.getElementById('timeSlider').value = 40;
    document.getElementById('timeDisplay').textContent = '40분';
    document.getElementById('homeBtn').disabled = true;
    document.getElementById('timerArc').style.stroke = 'var(--accent)';
    document.getElementById('timerArc').style.strokeDashoffset = '0';
    document.getElementById('timerVal').style.color = 'var(--text)';
    document.getElementById('locBtn').textContent = '📍 현재 위치로 주변 가게 찾기';
    document.getElementById('locBtn').disabled = false;
    allPlaces = [];
    goScreen('screen-home');
  }

  if ('Notification' in window) Notification.requestPermission();
</script>
</body>
</html>
